spring.datasource.url=jdbc:mysql://localhost:3306/bookshelf
spring.datasource.username=${SQL_USER}
spring.datasource.password=${SQL_PASSWORD}
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5InnoDBDialect
spring.jpa.properties.hibernate.format_sql=true
server.error.include-message=always
springdoc.packagesToScan=com.enzubis.bookshelf_spring.user, com.enzubis.bookshelf_spring.bookshelf_entry
springdoc.pathsToMatch=bookshelf/*
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true